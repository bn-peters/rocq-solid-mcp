stages:
  - test

variables:
  OPAMCONFIRMLEVEL: "unsafe-yes"
  OPAMERRLOGLEN: "0"
  OPAMJOBS: "2"
  OPAMYES: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTEST_WORKERS: "auto"

test:
  stage: test
  image: ocaml/opam:ubuntu-24.04-ocaml-5.2
  timeout: 2h
  parallel:
    matrix:
      - ROCQ_SERIES: "9.0"
        ROCQ_CORE_VERSION: "9.0.0"
      - ROCQ_SERIES: "9.1"
        ROCQ_CORE_VERSION: "9.1.0"
      - ROCQ_SERIES: "9.2"
        ROCQ_CORE_VERSION: "9.2.0"
  cache:
    - key: "pip-${CI_COMMIT_REF_SLUG}"
      paths:
        - .cache/pip/
    - key: "opam-ubuntu-24.04-ocaml-5.2-rocq-${ROCQ_CORE_VERSION}"
      paths:
        - .cache/opam/rocq-${ROCQ_CORE_VERSION}/
  before_script:
    - sudo apt-get update
    - sudo apt-get install -y --no-install-recommends build-essential ca-certificates git libgmp-dev m4 make pkg-config python3-pip python3-venv
    - test -w "$CI_PROJECT_DIR" || sudo chown -R "$(id -u):$(id -g)" "$CI_PROJECT_DIR"
    - python3 --version
    - opam --version
    - export OPAMROOT="$CI_PROJECT_DIR/.cache/opam/rocq-${ROCQ_CORE_VERSION}"
    - if [ -d "$OPAMROOT/default/.opam-switch" ]; then echo "Using restored opam cache at $OPAMROOT"; else echo "No restored opam cache at $OPAMROOT"; fi
    - opam init --reinit --bare --disable-sandboxing --no-setup --yes
    - |
      if opam switch list --short | grep -qx default; then
        opam switch set default
      else
        opam switch create default ocaml-base-compiler.5.2.0 --yes
      fi
    - opam switch show
    - opam repository add coq-released https://coq.inria.fr/opam/released --yes || opam repository set-url coq-released https://coq.inria.fr/opam/released
    - opam repository add bpeters https://gitlab.mpi-sws.org/bpeters/opam.git --yes || opam repository set-url bpeters https://gitlab.mpi-sws.org/bpeters/opam.git
    - opam update
    - opam install -y "rocq-core=${ROCQ_CORE_VERSION}" rocq-stdlib bens-rocq-lsp
    - opam exec -- rocq --version
    - opam exec -- coq-lsp --version
    - python3 -m venv .venv
    - .venv/bin/python -m pip install --upgrade pip
    - .venv/bin/python -m pip install -e ".[dev]"
  script:
    - make test
