[project]
name = "rocq-solid-mcp"
version = "1.0.0"
description = "RocqSolid: an MCP server for Rocq proof development, backed by rocq-lsp"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benjamin Peters" }]
requires-python = ">=3.11"
keywords = ["rocq", "coq", "mcp", "proof assistant", "lsp", "agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=4.1,<5",
    "pydantic>=2.13,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-xdist>=3.6",
]

[project.urls]
Homepage = "https://github.com/bn-peters/rocq-solid-mcp"
Repository = "https://github.com/bn-peters/rocq-solid-mcp"
Issues = "https://github.com/bn-peters/rocq-solid-mcp/issues"

[project.scripts]
rocq-solid-mcp = "rocq_solid_mcp.cli:main"
# Legacy name from before the rename; kept so existing configurations work.
bens-rocq-mcp = "rocq_solid_mcp.cli:main"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
